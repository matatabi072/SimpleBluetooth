[package]
name = "simplebluetooth"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
pollster = "0.4"
raw-window-handle = "0.6"

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Enumeration",
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Registry",
]

[dependencies.windows-core]
version = "0.62"

[dependencies.windows-collections]
version = "0.3"

[dependencies.windows-future]
version = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
